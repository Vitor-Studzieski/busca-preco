x-app-env: &app-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina uma chave exclusiva para este ambiente}
  DJANGO_ALLOWED_HOSTS: ${PORTAL_HOST:?Defina o hostname do portal},127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${PORTAL_HOST}
  DJANGO_TRUST_LOCAL_PROXY: "1"
  PRICING_ADMIN_PATH: ${PRICING_ADMIN_PATH:?Defina o caminho administrativo com barra final}
  PRICING_REDIS_URL: redis://redis:6379/0
  PRICING_COLLECTION_HOURS: ${PRICING_COLLECTION_HOURS:-4,14}
  POSTGRES_DB: ${POSTGRES_DB:-pompeia}
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_APP_USER:-pompeia_app}
  POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina a senha do usuário de aplicação}
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pompeia}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-pompeia_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Defina a senha do usuário de migrations}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-pompeia_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MIGRATION_USER:-pompeia_migrator} -d ${POSTGRES_DB:-pompeia}"]
      interval: 5s
      retries: 10
    networks: [database]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deployment/create-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
  redis:
    image: redis:7-alpine
    networks: [database]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    environment:
      <<: *app-env
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-pompeia_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database]
  web:
    build: .
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}), timeout=3)"]
      interval: 15s
      retries: 5
    networks: [frontend, database]
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "manage.py", "collection_worker"]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [database, outbound]
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      PORTAL_HOST: ${PORTAL_HOST}
      PORTAL_OFFICE_CIDRS: ${PORTAL_OFFICE_CIDRS:?Informe os IPs ou sub-redes permitidos do escritório}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    networks: [frontend, outbound]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  caddy:
networks:
  frontend:
    internal: true
  database:
    internal: true
  outbound: {}
