<form class="market-search" method="get" action="{% url 'pricing:storefront' %}" aria-label="Pesquisar preços">
  <label class="market-search-field">
    <span class="market-sr-only">Nome, marca, embalagem ou código de barras</span>
    <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 4.5 4.5"/></svg>
    <input type="search" name="q" value="{{ query|default:'' }}" placeholder="Nome, marca, embalagem ou código de barras" maxlength="255" autocomplete="off" required>
    <kbd class="market-shortcut" aria-label="Atalho de teclado barra">/</kbd>
  </label>
  <button type="submit">Buscar</button>
</form>
