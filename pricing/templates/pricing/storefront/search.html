<form class="market-search" method="get" action="{% url 'pricing:storefront' %}" data-search-form aria-label="Pesquisar preços">
  <label class="market-sr-only" for="product-query">Nome, marca, embalagem ou código de barras</label>
  <div class="market-search-field">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="product-query" type="search" name="q" value="{{ query|default:'' }}"
           placeholder="Nome, marca, embalagem ou código de barras" maxlength="255"
           autocomplete="off" list="search-suggestions" aria-autocomplete="list"
           aria-controls="search-suggestions" required>
    <datalist id="search-suggestions" data-search-suggestions></datalist>
    <span class="market-barcode-badge" data-barcode-badge hidden>Código de barras</span>
    <button class="market-clear-search" type="button" data-clear-query aria-label="Limpar busca" hidden>×</button>
    <kbd class="market-shortcut" aria-label="Atalho de teclado barra">/</kbd>
  </div>
  <button class="market-search-submit" type="submit" data-submit-search>
    <span class="market-button-label">Buscar</span>
    <span class="market-button-spinner" aria-hidden="true" hidden></span>
  </button>
</form>
