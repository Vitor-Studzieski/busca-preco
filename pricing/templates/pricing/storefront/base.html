{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1046d3">
  <title>{% block title %}Pesquisar preços{% endblock %} | busca-preço</title>
  <link rel="stylesheet" href="{% static 'pricing/storefront.css' %}">
</head>
<body>
  <a class="market-skip" href="#conteudo">Pular para o conteúdo</a>
  <header class="market-header">
    <div class="market-shell market-header-inner">
      <a class="market-brand" href="{% url 'pricing:storefront' %}" aria-label="busca-preço, página de pesquisa">
        <span class="market-brand-icon" aria-hidden="true"></span>busca<span>-preço</span>
      </a>
      <nav class="market-nav" aria-label="Navegação principal">
        <a href="{% url 'pricing:storefront' %}" aria-current="page">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 4.5 4.5"/></svg>
          Pesquisar
        </a>
      </nav>
    </div>
  </header>
  <main id="conteudo" class="market-shell market-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="market-footer">
    <div class="market-shell market-footer-inner">Preços e disponibilidade podem mudar após a consulta.</div>
  </footer>
  <script defer src="{% static 'pricing/recent-searches.js' %}"></script>
</body>
</html>
