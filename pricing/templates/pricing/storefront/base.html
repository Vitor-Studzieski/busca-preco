{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E3A8A">
  <title>{% block title %}Pesquisar preços{% endblock %} | busca-preço</title>
  <link rel="stylesheet" href="{% static 'pricing/storefront.css' %}">
</head>
<body>
  <a class="market-skip" href="#conteudo">Pular para o conteúdo</a>
  <header class="market-header">
    <div class="market-shell market-header-inner">
      <a class="market-brand" href="{% url 'pricing:storefront' %}" aria-label="busca-preço, página inicial">
        <span class="market-brand-icon" aria-hidden="true"></span>busca<span>-preço</span>
      </a>
      <div class="market-header-status" role="status" aria-live="polite">
        <span class="market-status-dot" aria-hidden="true"></span>
        <span data-overall-status>5 unidades</span>
      </div>
    </div>
  </header>
  <main id="conteudo" class="market-shell market-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="market-footer">
    <div class="market-shell market-footer-inner">
      <span>Preços e disponibilidade podem mudar após a consulta.</span>
      <time data-last-update hidden></time>
    </div>
  </footer>
  <script defer src="{% static 'pricing/storefront.js' %}"></script>
</body>
</html>
