{% load static %}
<span class="market-store-mark">
  {% if store.logo %}
    <img src="{% static store.logo %}" width="48" height="48" alt="Logo {{ store.get_retailer_display }}" loading="lazy">
  {% else %}
    <span aria-hidden="true">{{ store.get_retailer_display|first }}</span>
  {% endif %}
</span>
