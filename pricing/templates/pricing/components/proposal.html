<aside class="panel proposal" aria-labelledby="proposal-title">
  <h2 id="proposal-title">Propor preço</h2>
  {% if not publish_ready %}<p class="muted">Atualize as unidades com coleta pendente para publicar. O rascunho já pode ser salvo.</p>{% endif %}
  <form method="post" action="{% url 'pricing:publish' product.pk %}" data-price-proposal>
    {% csrf_token %}
    <div class="proposal-inputs">
      <label for="proposal-amount">Valor proposto (R$)</label>
      <input id="proposal-amount" name="amount" inputmode="decimal" autocomplete="off" required>
      <label for="proposal-kind">Tipo</label>
      <select id="proposal-kind" name="kind"><option value="regular">Regular</option><option value="promotion">Promoção</option></select>
      <label for="proposal-starts">Início da vigência</label>
      <input id="proposal-starts" name="starts_at" type="datetime-local" required>
      <label for="proposal-ends">Fim da vigência</label>
      <input id="proposal-ends" name="ends_at" type="datetime-local">
      <label for="proposal-note">Justificativa</label>
      <textarea id="proposal-note" name="note" maxlength="500" rows="2"></textarea>
    </div>
    <output class="preview" aria-live="polite" data-proposal-preview hidden></output>
    {{ preview_prices|json_script:"proposal-sources" }}
    {% if publish_ready %}
    <label class="filter-toggle"><input type="checkbox" name="confirm" required> Confirmo valor e vigência</label>
    <button class="primary" type="submit">Publicar no portal</button>
    {% endif %}
    <button class="secondary" type="submit" formaction="{% url 'pricing:product' product.pk %}" name="return_to_search" value="1" formnovalidate>Salvar rascunho</button>
  </form>
  <a class="back" href="{% url 'pricing:product' product.pk %}">Ver rascunhos e vigências</a>
</aside>
