services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pompeia
      POSTGRES_USER: pompeia_dev
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pompeia_dev -d pompeia"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  web:
    build: .
    image: pompeia-portal:dev
    init: true
    restart: unless-stopped
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-compose-only-secret-do-not-use-in-production-2026
      POSTGRES_DB: pompeia
      POSTGRES_USER: pompeia_dev
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PRICING_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./manage.py:/portal/manage.py:ro
      - ./project:/portal/project:ro
      - ./pricing:/portal/pricing:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  worker:
    build: .
    image: pompeia-portal:dev
    init: true
    restart: unless-stopped
    stop_grace_period: 65s
    command: ["python", "manage.py", "collection_worker"]
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-compose-only-secret-do-not-use-in-production-2026
      POSTGRES_DB: pompeia
      POSTGRES_USER: pompeia_dev
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PRICING_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./manage.py:/portal/manage.py:ro
      - ./project:/portal/project:ro
      - ./pricing:/portal/pricing:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
volumes:
  postgres-dev:
